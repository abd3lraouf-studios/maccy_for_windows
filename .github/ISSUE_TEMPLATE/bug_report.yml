name: Bug report
description: Report a problem you can reproduce
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem.
        Do not include passwords, tokens, real clipboard content, or unredacted databases.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues and found no report of the same problem.
          required: true
        - label: I removed all sensitive information and real clipboard content.
          required: true

  - type: input
    id: version
    attributes:
      label: App version or Git commit
      placeholder: For example, 1.0.0 or a1a7947
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: For example, Windows 11 24H2 x64
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: How you run it
      options:
        - Release installer
        - Local build
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Describe clearly what actually happened.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give the smallest set of steps that reproduces the problem every time.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs, screenshots, or recordings
      description: Redact them first. Do not upload databases or real clipboard content.
      render: text
    validations:
      required: false
