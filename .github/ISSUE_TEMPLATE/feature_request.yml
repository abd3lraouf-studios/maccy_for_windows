name: Feature request
description: Suggest a new feature or a change in behavior
title: "[Feature]: "
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues and feature requests.
          required: true
        - label: I am describing a real problem, not only an implementation idea.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who runs into what problem? What is limiting today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior and result you expect as a user.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Describe any alternatives or workarounds you have considered.
    validations:
      required: false

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Describe the effect on performance, storage, privacy, compatibility, and the UI.
    validations:
      required: false
